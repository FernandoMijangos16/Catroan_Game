<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwapHolm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:rgba(18,22,27,.84);--line:rgba(255,255,255,.1);--ink:#f3eee2;--muted:#aaa697;--accent:#f0b429}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1114;font-family:'Pixelify Sans',monospace;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.panel{background:var(--bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 11px;cursor:pointer;white-space:nowrap;line-height:1.2}
button:hover:not(:disabled){background:rgba(255,255,255,.16)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);color:#1d1606;border-color:transparent}
button.primary:hover:not(:disabled){background:#ffc845}
button.on{outline:2px solid var(--accent);outline-offset:1px}
button small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:2px}
.muted{color:var(--muted)}
#hud-top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none;flex-wrap:wrap;z-index:10}
.brand{font-family:'Pixelify Sans',monospace;font-weight:800;font-size:22px;letter-spacing:.3px;text-shadow:0 2px 10px rgba(0,0,0,.55);padding:2px 6px}
.fwin{position:fixed;left:12px;top:62px;z-index:12;padding:12px;border-radius:16px;border:1.5px solid transparent;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;--s:58px;transition:background .15s,border-color .15s}
.fwin.hov,.fwin.drag{border-color:rgba(240,180,41,.8);background:rgba(18,22,27,.3);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fwin.drag{cursor:grabbing}
.fwin .ibar{position:absolute;left:50%;top:-17px;transform:translateX(-50%);display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.fwin.hov .ibar,.fwin.drag .ibar{opacity:1;pointer-events:auto}
.fwin .ibar button{display:flex;align-items:center;gap:5px;padding:4px 9px;font-size:11.5px;line-height:1;border-radius:8px;background:var(--accent);color:#1d1606;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.fwin .ibar button:hover{background:#ffc845}
.fwin .slots{display:flex;flex-direction:column;gap:calc(var(--s)*-.02)}
.fwin.h .slots{gap:calc(var(--s)*.12)}
.fwin.h .slots{flex-direction:row}
.islot{position:relative;width:var(--s);height:calc(var(--s)*1.3);pointer-events:none}
.islot .sq{position:absolute;left:0;bottom:0;width:var(--s);height:var(--s)}
.islot .nm{position:absolute;top:0;left:50%;transform:translateX(-50%);font:700 calc(var(--s)*.2)/1 'Pixelify Sans',monospace;color:#f6e7c1;text-shadow:0 1px 0 #1a0f06,0 0 5px rgba(0,0,0,.85);white-space:nowrap;letter-spacing:.3px}
.islot.zero .nm{opacity:.6}
.islot.want .nm,.islot.active .nm{color:#ffd34a}
.islot .dia{position:absolute;inset:14.6%;transform:rotate(45deg);background:rgba(22,26,32,.4);border:1px solid rgba(255,255,255,.24);border-radius:calc(var(--s)*.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 0 calc(var(--s)*.2) rgba(255,255,255,.07),0 4px 12px rgba(0,0,0,.25)}
.islot canvas{position:absolute;left:4%;top:4%;width:92%;height:92%;image-rendering:pixelated;transition:opacity .3s,filter .3s}
.islot.zero canvas{opacity:.3;filter:grayscale(1)}
.islot b{position:absolute;right:6%;bottom:2%;font:900 calc(var(--s)*.25)/1 Verdana,'DejaVu Sans',Arial,sans-serif;color:#fff;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8)}
.islot.zero b{opacity:.5}
.islot.pulse .dia{animation:ipulse .6s ease}
@keyframes ipulse{35%{transform:rotate(45deg) scale(1.22);border-color:#f0b429;background:rgba(240,180,41,.38)}}
.fwin .rs{position:absolute;width:16px;height:16px;opacity:0;pointer-events:none;border:0 solid var(--accent);transition:opacity .15s}
.fwin.hov .rs,.fwin.drag .rs{opacity:1;pointer-events:auto}
.fwin .rs.tl{left:-5px;top:-5px;border-width:3px 0 0 3px;border-radius:7px 0 0 0;cursor:nwse-resize}
.fwin .rs.tr{right:-5px;top:-5px;border-width:3px 3px 0 0;border-radius:0 7px 0 0;cursor:nesw-resize}
.fwin .rs.bl{left:-5px;bottom:-5px;border-width:0 0 3px 3px;border-radius:0 0 0 7px;cursor:nesw-resize}
.fwin .rs.br{right:-5px;bottom:-5px;border-width:0 3px 3px 0;border-radius:0 0 7px 0;cursor:nwse-resize}
.invfly{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:40;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}

.islot .need{position:absolute;left:100%;top:50%;transform:translate(-4px,-50%);font:700 calc(var(--s)*.24)/1 'Pixelify Sans',monospace;font-style:normal;color:#fff;background:#b8322a;border:2px solid #1a0f06;border-radius:8px;padding:3px 6px;display:none;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.islot .need.ok{background:#3a8a44}
.fwin.h .islot .need{left:50%;top:auto;bottom:100%;transform:translate(-50%,2px)}
.islot.want .need{display:block}
.islot.want .dia{border-color:#f0b429;background:rgba(240,180,41,.3);box-shadow:0 0 14px rgba(240,180,41,.7),inset 0 0 12px rgba(255,255,255,.15)}
.islot.want canvas{opacity:1;filter:none}
.islot.active .dia{border-color:#ffd34a;background:rgba(255,211,74,.35);box-shadow:0 0 18px rgba(255,211,74,.9)}
#board-ui{display:none !important}
#hexbar{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:11;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#hexbar canvas{pointer-events:auto;display:block}
#hb-status{text-align:center;font-family:'Pixelify Sans',monospace;color:#f6e7c1;text-shadow:0 2px 0 #1a0f06,0 0 10px rgba(0,0,0,.7);margin-bottom:-14px;position:relative;z-index:2}
#hb-status b{display:block;font-size:17px;letter-spacing:.4px}
#hb-status span{font-size:12.5px;opacity:.9}
#hb-tip{position:fixed;display:none;padding:9px 12px;font-size:13px;max-width:260px;pointer-events:none;z-index:30}
#hb-tip b{font-family:'Pixelify Sans',monospace;font-size:15px}
.hb-cost{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.hb-cost span{display:flex;align-items:center;gap:2px;font-weight:700}
.hb-cost span.no{color:#ff8a7a}.hb-cost span.ok{color:#9be08a}
.hb-cost .ri{width:22px;height:22px}
.hb-why{margin-top:6px;color:#f0b429;font-size:12px}
#b-endturn{position:fixed;right:16px;bottom:18px;z-index:11;display:flex;align-items:center;gap:10px;font:700 16px 'Pixelify Sans',monospace;color:#f6e7c1;padding:12px 20px 12px 16px;border-radius:10px;background:linear-gradient(#80583a,#4e321c 60%,#3e2614);border:3px solid #1d1209;box-shadow:inset 0 2px 0 rgba(255,225,170,.35),inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 2px #b98a36,0 8px 22px rgba(0,0,0,.5);text-shadow:0 2px 0 #1a0f06;letter-spacing:.5px;transition:transform .12s,filter .2s}
#b-endturn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.12);background:linear-gradient(#80583a,#4e321c 60%,#3e2614)}
#b-endturn:disabled{filter:grayscale(.85) brightness(.6);opacity:.75}
#b-endturn.ready{animation:endglow 2.2s ease-in-out infinite}
@keyframes endglow{50%{box-shadow:inset 0 2px 0 rgba(255,225,170,.35),inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 2px #f0c050,0 0 22px rgba(240,180,41,.65)}}
body:not([data-mode=board]) #hexbar,body:not([data-mode=board]):not([data-mode=village]) #b-endturn,body:not([data-mode=board]) #cards{display:none}
body[data-mode=village] #b-endturn:disabled{display:none}
#cards{position:fixed;left:38px;bottom:0;height:0;z-index:13}
.card{position:absolute;bottom:0;left:0;width:96px;height:134px;transform:translate(var(--x),calc(48% + var(--ly))) rotate(var(--r));transform-origin:50% 130%;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .2s;cursor:pointer;perspective:600px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.card .cin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;backface-visibility:hidden;border-radius:4px}
.card .back{transform:rotateY(180deg)}
.card:hover{transform:translate(var(--x),-6%) rotate(0deg) scale(1.22);z-index:99 !important;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.card.play:hover{filter:drop-shadow(0 0 12px rgba(240,180,41,.9)) drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.card.incoming{transform:translate(var(--x),130%) rotate(0deg);transition:none}
.card.incoming .cin{transform:rotateY(180deg);transition:none}
.ct-k{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.ct-ok{color:#9be08a;font-weight:700;font-size:13px}.ct-no{color:#f0b429;font-size:13px}
#announce{position:fixed;left:50%;top:64px;transform:translate(-50%,-14px);opacity:0;z-index:31;display:flex;align-items:center;gap:12px;padding:12px 20px 12px 14px;font:600 18px 'Pixelify Sans',monospace;color:#f6e7c1;border-left:5px solid var(--c,#aaa);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1);max-width:min(620px,92vw);text-align:left}
#announce.in{opacity:1;transform:translate(-50%,0)}
#announce i{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c,#aaa);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
#announce .ri{width:26px;height:26px;vertical-align:middle}
#log{display:none !important}

#toasts,#announce{display:none !important}
@keyframes unroll{from{max-height:0}to{max-height:260px}}
.sname{font:700 17px 'Pixelify Sans',monospace;color:var(--pt,#2a1a0c);background:var(--pc);border:2px solid #2a1a0c;border-radius:4px;letter-spacing:.5px;padding:2px 14px;display:inline-block;min-width:50%;box-shadow:0 2px 0 rgba(42,26,12,.35)}
.sact{font:500 14px/1.35 'Pixelify Sans',monospace;margin-top:6px}
.sact .ri{width:20px;height:20px;vertical-align:-4px}
.smodel{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:6px;min-height:70px}
.smod{width:84px;height:84px;image-rendering:pixelated;filter:drop-shadow(0 4px 3px rgba(60,40,20,.35))}
.sres{width:48px;height:48px;filter:drop-shadow(0 3px 2px rgba(60,40,20,.35))}
.seal{position:absolute;right:10px;bottom:8px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5,transparent 40%),var(--pc);border:2px solid rgba(30,15,5,.7);color:rgba(30,15,5,.6);font:700 14px Georgia,serif;display:grid;place-items:center;box-shadow:0 2px 3px rgba(0,0,0,.3);transform:rotate(-12deg)}
#offer{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(8,5,2,.72);-webkit-backdrop-filter:blur(3px) grayscale(.5);backdrop-filter:blur(3px) grayscale(.5)}
#offer.show{display:flex;animation:ofade .3s}
@keyframes ofade{from{opacity:0}}
.oscroll{position:relative;width:min(420px,88vw);animation:oglow 2s ease-in-out infinite,oopen .55s cubic-bezier(.3,.7,.2,1)}
@keyframes oglow{0%,100%{filter:drop-shadow(0 0 14px rgba(255,210,110,.55)) drop-shadow(0 12px 20px rgba(0,0,0,.6))}50%{filter:drop-shadow(0 0 30px rgba(255,210,110,.95)) drop-shadow(0 12px 20px rgba(0,0,0,.6))}}
@keyframes oopen{from{transform:scaleY(.15);opacity:.3}}
#offer .pin{padding:16px 22px 20px}
#offer .sname{font-size:24px}
.otitle{font:italic 600 18px 'Pixelify Sans',monospace;margin:6px 0 10px}
.oswap{display:flex;justify-content:center;align-items:center;gap:18px}
.olbl{font:600 12px 'Pixelify Sans',monospace;text-transform:uppercase;letter-spacing:1px;color:#6a4a2a;margin-bottom:4px}
.ores{display:inline-flex;flex-direction:column;align-items:center;margin:0 4px}
.ores img{width:64px;height:64px;filter:drop-shadow(0 3px 2px rgba(60,40,20,.4))}
.ores b{font:700 16px 'Pixelify Sans',monospace}
.oarrow{font-size:30px;color:#6a4a2a}
.onote{margin-top:8px;color:#8a2a1a;font:italic 13px 'Pixelify Sans',monospace}
.obtns{display:flex;justify-content:center;gap:22px;margin-top:16px}
button.ink{font:italic 700 21px 'Pixelify Sans',monospace;color:#f6ead0;padding:10px 26px;border:0;border-radius:48% 52% 45% 55% / 58% 42% 60% 40%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.45),0 3px 0 rgba(20,10,5,.35);text-shadow:0 1px 0 rgba(0,0,0,.6);transition:transform .12s}
button.ink.yes{background:radial-gradient(ellipse at 40% 35%,#3a6a3e,#1a321c 70%)}
button.ink.no{background:radial-gradient(ellipse at 40% 35%,#6a2a24,#2e0f0c 70%)}
button.ink:hover:not(:disabled){transform:scale(1.07) rotate(-1deg);background-color:transparent}
button.ink.yes:hover:not(:disabled){background:radial-gradient(ellipse at 40% 35%,#4a7e4e,#1a321c 70%)}
button.ink.no:hover:not(:disabled){background:radial-gradient(ellipse at 40% 35%,#7e3a32,#2e0f0c 70%)}
button.ink:disabled{opacity:.4}
.quill{position:absolute;right:-46px;top:30px;transform-origin:20% 85%;animation:quill 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
@keyframes quill{0%,100%{transform:rotate(14deg)}50%{transform:rotate(6deg) translateY(4px)}}
.stp{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:3px 6px}
.stp button{padding:2px 8px;font-size:15px}
.stp b{min-width:14px;text-align:center}
.tabs{margin:4px 0 8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}

button{font:600 13px 'Pixelify Sans',monospace;letter-spacing:.3px;color:#f3e6c8;background:linear-gradient(165deg,#86603c 0 38%,#6e4c2c 38% 68%,#5a3c20 68%);border:0;border-radius:0;padding:8px 13px;clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);box-shadow:inset 0 0 0 2px #1d1209,inset 0 0 0 3px rgba(220,170,90,.35),inset 0 -3px 0 rgba(0,0,0,.35);text-shadow:0 1px 0 #1a0f06}
button:hover:not(:disabled){background:linear-gradient(165deg,#9a7048 0 38%,#7e5834 38% 68%,#664428 68%)}
button.primary{color:#2a1606;text-shadow:0 1px 0 rgba(255,240,200,.5);background:linear-gradient(165deg,#f2cc62 0 38%,#d9a83a 38% 68%,#b8862a 68%)}
button.primary:hover:not(:disabled){background:linear-gradient(165deg,#ffd978 0 38%,#e8b848 38% 68%,#c9963a 68%)}
button.on{outline:none;box-shadow:inset 0 0 0 2px #1d1209,inset 0 0 0 4px #f0c050,inset 0 -3px 0 rgba(0,0,0,.35)}
button small{font-family:'Pixelify Sans',monospace}
#b-endturn{clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);border:0;border-radius:0;box-shadow:inset 0 0 0 3px #1d1209,inset 0 0 0 5px #b98a36,inset 0 0 0 7px #1d1209,inset 0 3px 0 7px rgba(255,225,170,.0);background:linear-gradient(165deg,#86603c 0 40%,#6a4628 40% 70%,#4e321c 70%);padding:14px 22px 14px 18px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#b-endturn:hover:not(:disabled){background:linear-gradient(165deg,#9a7048 0 40%,#7a5232 40% 70%,#5a3c22 70%)}
#b-endturn.ready{animation:endglow2 2.2s ease-in-out infinite}
@keyframes endglow2{0%,100%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}50%{filter:drop-shadow(0 0 10px rgba(240,180,41,.9)) drop-shadow(0 6px 10px rgba(0,0,0,.5))}}
button.ink{border-radius:0;clip-path:polygon(4% 24%,13% 6%,36% 3%,58% 8%,84% 0,98% 16%,100% 58%,93% 86%,70% 100%,42% 95%,17% 100%,2% 80%);box-shadow:none;padding:12px 30px}
button.ink.yes{background:linear-gradient(160deg,#4a7e4e 0 30%,#2e5a32 30% 62%,#1a321c 62%)}
button.ink.no{background:linear-gradient(160deg,#7e3a32 0 30%,#5a2420 30% 62%,#2e0f0c 62%)}
button.ink.yes:hover:not(:disabled){background:linear-gradient(160deg,#5a9a5e 0 30%,#3a6e3e 30% 62%,#1e3a20 62%)}
button.ink.no:hover:not(:disabled){background:linear-gradient(160deg,#9a4a40 0 30%,#6e2c26 30% 62%,#3a1410 62%)}
.pl{position:relative;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 8px;background:var(--plate);background-size:32px;image-rendering:pixelated;color:#f3e6c8;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);box-shadow:inset 0 0 0 2px #1a0f06,inset 0 0 0 4px #8a6a3a,inset 0 0 0 5px #1a0f06,inset 0 6px 0 rgba(255,220,170,.06);filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.pl .shield{flex:none;image-rendering:pixelated}
.pl .pli b{display:block;font:700 15px/1.1 'Pixelify Sans',monospace;letter-spacing:.4px;text-shadow:0 1px 0 #1a0f06;border-bottom:2px solid var(--pc);padding-bottom:1px;margin-bottom:2px}
.pl .pls{display:flex;gap:8px;font:600 13px 'Pixelify Sans',monospace;color:#e8d8b4}
.pl .pls span{display:inline-flex;align-items:center;gap:3px}
.pl.active{box-shadow:inset 0 0 0 2px #1a0f06,inset 0 0 0 4px #f0c050,inset 0 0 0 5px #1a0f06;filter:drop-shadow(0 0 6px rgba(240,180,41,.85)) drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.think{position:absolute;right:6px;top:5px;display:flex;gap:2px}
.think i{width:4px;height:4px;background:#f0c050;animation:think 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes think{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-width:900px){.pl .pls span:nth-child(n+3){display:none}}
#news-board{position:relative;width:62px;height:62px;pointer-events:auto;cursor:pointer;flex:none;margin:-8px 0 -10px;transition:transform .15s}
#news-board canvas{width:62px;height:62px;image-rendering:pixelated;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
#news-board:hover{transform:translateY(-2px) scale(1.06)}
#news-board.bump{animation:nbump .5s}
@keyframes nbump{30%{transform:scale(1.15) rotate(-4deg)}}
#news-board .nb-n{position:absolute;right:-2px;top:4px;min-width:18px;padding:1px 4px;font:700 11px/14px 'Pixelify Sans',monospace;color:#fff6e0;background:#a8322a;border:2px solid #1a0f06;text-align:center;display:none}
#news{position:fixed;z-index:45;width:360px;display:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
#news.show{display:block;animation:oopen .4s cubic-bezier(.3,.7,.2,1)}
#news .paper{max-height:58vh;overflow:auto;padding:8px 14px 12px}
.ntitle{font:700 18px 'Pixelify Sans',monospace;text-align:center;color:#3a2414;margin:4px 0 8px;letter-spacing:.6px}
.nrow{display:flex;gap:8px;align-items:flex-start;padding:6px 2px;border-bottom:1px dashed rgba(90,60,30,.35)}
.nname{flex:none;font:700 12px/18px 'Pixelify Sans',monospace;background:var(--pc);color:var(--pt);border:1px solid #2a1a0c;padding:0 6px;min-width:44px;text-align:center}
.ntxt{font:500 13px/1.35 'Pixelify Sans',monospace;color:#3a2414}
.ntxt .ri{width:18px;height:18px;vertical-align:-4px}
#news .paper{background:var(--paper);background-size:64px;box-shadow:inset 0 0 18px rgba(120,80,30,.45);border-left:3px solid rgba(90,60,30,.35);border-right:3px solid rgba(90,60,30,.35)}
.wseal{position:absolute;left:50%;bottom:0;transform:translate(-50%,62%);z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}

#players{display:flex;gap:6px;flex-wrap:wrap}
#toasts{position:fixed;top:60px;right:12px;width:min(340px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
.toast{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:13.5px;line-height:1.35;transform:translateX(120%);opacity:0;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s}
.toast.in{transform:none;opacity:1}
.toast>i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:18px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.toast .tt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
#board-ui{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(800px,calc(100vw - 20px));padding:12px;display:flex;flex-direction:column;gap:10px;z-index:10}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:14px}
#dice{display:flex;gap:6px}
.die{width:34px;height:34px;border-radius:8px;background:#f6efe0;color:#222;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.die.roll{animation:roll .45s ease}
@keyframes roll{0%{transform:rotate(0) scale(.6)}60%{transform:rotate(300deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
#turn-label{font-weight:600;font-size:14px}
#res{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.ri{width:24px;height:24px;vertical-align:-7px;margin:-4px 0}
button small .ri{width:18px;height:18px;vertical-align:-4px;margin:0 -2px}
.chip{padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;white-space:nowrap}
#hint{font-size:12.5px;color:var(--muted);min-height:16px}
#log{position:fixed;left:12px;bottom:12px;width:250px;max-height:36vh;overflow:auto;padding:10px 12px;font-size:12px;line-height:1.4;z-index:10}
#log h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
#log div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:7px}
#log div i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px}
@media (max-width:1340px){#log{display:none}}
#popup{position:fixed;display:none;padding:12px;width:250px;z-index:20}
.pp-title{font-family:'Pixelify Sans',monospace;font-size:20px;font-weight:800}
.pp-sub{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:2px 0 8px}
.pp-sub i,.v-sub i,.dest i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.pp-prod{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pp-prod .chip{font-size:12px}
#popup button{width:100%}
/* modes */
body:not([data-mode=board]) #board-ui, body:not([data-mode=board]) #log, body:not([data-mode=board]) #popup{display:none!important}
#village-ui{display:none}
body[data-mode=village] #village-ui{display:block}
#v-card{position:fixed;top:112px;left:170px;padding:12px 14px;max-width:300px;z-index:10}
#v-card:empty{display:none}
.v-name{font-family:'Pixelify Sans',monospace;font-size:26px;font-weight:800;line-height:1.1}
.v-sub{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:4px 0 8px}
#v-btns{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
#v-btns button{padding:10px 14px;font-size:14px}
#v-btns .mapbtn{padding:0;background:none;border:0;box-shadow:none;cursor:pointer;width:150px;height:118px}
#v-btns .mapbtn canvas{width:150px;height:118px;display:block;image-rendering:pixelated;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
#v-btns{bottom:4px}
#v-help{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);font-size:12.5px;color:#fff;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.6);white-space:nowrap;z-index:10}
#v-turn{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1d1606;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px;display:none;z-index:12;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#dpad{position:fixed;left:16px;bottom:16px;display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;z-index:10}
#dpad button{font-size:20px;padding:0;background:rgba(18,22,27,.6);touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){#dpad{display:grid}#v-help{display:none}#v-btns{left:auto;right:12px;transform:none;flex-direction:column}}
#t-label{font-family:'Pixelify Sans',monospace;font-size:19px;font-weight:800;margin-bottom:8px}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(5,8,10,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.hidden{display:none}
.modal>.panel{padding:20px 22px;width:min(480px,100%);max-height:86vh;overflow:auto}
.modal h2{font-family:'Pixelify Sans',monospace;font-size:30px;margin:0 0 4px}
.modal h3{font-family:'Pixelify Sans',monospace;font-size:21px;margin:0 0 6px}
.modal p{font-size:14px;line-height:1.5;margin:6px 0}
.modal ul{padding-left:18px;font-size:14px;line-height:1.5;margin:10px 0}
.modal li{margin:5px 0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:14px 0 6px}
.dests{display:flex;flex-direction:column;gap:6px}
.dest{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px}
.dest b{font-size:14px}
#bubble{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(10px);opacity:0;transition:opacity .25s,transform .25s;padding:12px 16px;max-width:min(440px,90vw);font-size:14.5px;line-height:1.45;pointer-events:none;z-index:15}
#bubble.show{opacity:1;transform:translateX(-50%)}
#bubble b{color:var(--accent)}
#fade{position:fixed;inset:0;background:#fff7ea;opacity:0;pointer-events:none;z-index:35}
body.retro .brand, body.retro .v-name, body.retro #t-label, body.retro .modal h2, body.retro .modal h3, body.retro .pp-title{font-family:'Pixelify Sans',monospace;letter-spacing:.5px}
body.retro .panel{border-radius:6px}
#b-retro.off{opacity:.45}
#vignette{display:none!important;position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(10,8,20,.38) 100%);display:none}
body[data-mode=village] #vignette{display:block}
#hud-right{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
#hud-right button{padding:7px 11px;font-size:13px}
#b-time{display:none}
body[data-mode=village] #b-time{display:block}
body.nocycle #b-time{display:none !important}
#hud-right .panel .m3{width:26px;height:26px;margin:-4px 0}
@media (max-width:700px){#players .pl span{display:none}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:60;font-size:15px}

/* ---- showcase (hand of cards / amulets) ---- */
#showcase{position:fixed;inset:0;z-index:44;display:none;flex-direction:column;align-items:center;justify-content:center;gap:52px;background:radial-gradient(ellipse at center,rgba(8,6,4,.55),rgba(4,3,2,.82))}
#showcase.show{display:flex;animation:ofade .25s}
#showcase .sctitle{font:700 22px 'Pixelify Sans',monospace;color:#f0dcb4;text-shadow:0 2px 0 #000;letter-spacing:1px;zoom:var(--ui,1)}
#showcase .scrow{display:flex;align-items:flex-end;justify-content:center;zoom:var(--ui,1)}
#showcase .sct{position:relative;margin:0 -14px;transform:translateY(var(--y)) rotate(var(--r));transform-origin:50% 120%;transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .2s;cursor:pointer;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
#showcase .sct.on{transform:translateY(calc(var(--y) - 34px)) rotate(var(--r)) scale(1.06);z-index:99 !important;filter:drop-shadow(0 0 16px rgba(240,190,90,.75)) drop-shadow(0 14px 18px rgba(0,0,0,.7))}
#showcase .cards .sct img{width:180px;height:252px;image-rendering:pixelated;display:block;border-radius:0}
#showcase .cards .sct i{position:absolute;right:8px;top:8px;width:12px;height:12px;border-radius:50%;border:2px solid #0d0906}
#showcase .cards .sct i.ok{background:#6ad04a}#showcase .cards .sct i.no{background:#7a6a5a}
#showcase .amulets .sct{margin:0 6px;width:140px;display:flex;flex-direction:column;align-items:center;padding:6px 4px 10px;background:var(--pbtex,#1a1612) 0 0/288px 96px;border:2px solid #0d0906;box-shadow:inset 0 0 0 2px #3a3026}
#showcase .amulets canvas{width:120px;height:120px;image-rendering:pixelated}
#showcase .amulets span{font:700 13px 'Pixelify Sans',monospace;color:#f0dcb4;text-align:center}
#showcase .amulets em{position:absolute;right:8px;top:6px;font:900 15px Verdana,sans-serif;font-style:normal;color:#ffd890;text-shadow:0 1px 0 #000}
#showcase .schint{font:600 12px 'Pixelify Sans',monospace;color:#b8a888;zoom:var(--ui,1)}
/* ---- amulet box next to the hand ---- */
#amubox{position:fixed;left:30px;bottom:46px;z-index:12;width:112px;height:98px;cursor:pointer;zoom:var(--ui,1);filter:blur(1.6px) brightness(.72) drop-shadow(0 6px 8px rgba(0,0,0,.55));transform:scale(.9);transition:filter .35s,transform .35s,left .35s,bottom .35s}
#amubox canvas{width:112px;height:98px;image-rendering:pixelated;display:block}
body.nocards #amubox{left:20px;bottom:6px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));transform:none}
body.boxfront #amubox{z-index:15;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6));transform:scale(1.08);left:40px;bottom:20px}
body.boxfront #cards{filter:blur(1.6px) brightness(.68);z-index:12}
#cards{transition:filter .35s}
body.deckspin #amubox{animation:dspin .55s ease-in-out}
body.deckspin #cards{animation:dspin2 .55s ease-in-out}
@keyframes dspin{50%{transform:scale(1) rotateY(180deg) translateY(-14px)}}
@keyframes dspin2{50%{transform:translateY(-12px) rotate(-6deg)}}
#amubox b{position:absolute;right:4px;top:2px;min-width:18px;padding:0 4px;font:900 13px Verdana,sans-serif;color:#ffe2a8;background:#2a1a0e;border:2px solid #0d0906;text-align:center}
#amubox b:empty{display:none}
#amubox.empty{opacity:.75}
body:not([data-mode=board]):not([data-mode=village]) #amubox,body.registering #amubox{display:none}
#cards{left:60px !important}
.card .back{filter:none}
.card img{border-radius:0 !important}
/* ---- trophies beside the dice ---- */
#trophies{position:absolute;right:calc(100% - 26px);bottom:132px;display:flex;gap:2px;pointer-events:auto}
#trophies .troph{display:none;width:70px;height:84px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.55))}
#trophies .troph.on{display:block;animation:tpop .5s cubic-bezier(.3,1.6,.5,1)}
#trophies canvas{width:70px;height:84px;image-rendering:pixelated;display:block}
@keyframes tpop{from{transform:scale(.3) translateY(30px);opacity:0}}
/* ---- 3D icons inline ---- */
.m3{display:inline-block;width:1.6em;height:1.6em;vertical-align:middle;margin:-.35em .04em -.25em}
.m3 canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.fxb .m3{width:18px;height:18px;margin:0}
/* ---- faceted dark notice box (system notices, dialogs, missions) ---- */
#pbox{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:46;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:94vw}
#pbox .pb{zoom:var(--ui,1);pointer-events:none;position:relative;isolation:isolate;display:none;align-items:center;gap:10px;max-width:min(600px,92vw);padding:10px 22px 16px;color:#efe2c6;font:600 14px/1.45 'Pixelify Sans',monospace;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);opacity:0;transform:translateY(8px);transition:opacity .22s,transform .25s}
#pbox .pb::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--pbtex) 0 0/288px 96px repeat;image-rendering:pixelated;opacity:.6;-webkit-mask-image:linear-gradient(#000 0,#000 40%,rgba(0,0,0,.55) 75%,transparent 100%);mask-image:linear-gradient(#000 0,#000 40%,rgba(0,0,0,.55) 75%,transparent 100%)}
#pbox .pb.on{display:flex}
#pbox .pb.in{opacity:1;transform:none}
#pbox .pb b{color:#ffe3a8}
#pbox .pb .muted{color:#b8a888}
#pbox .pb i[style*="--c"]{width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid #0d0906;display:inline-block;vertical-align:-1px;margin-right:4px}
#pbox .pb u{cursor:pointer;color:#ffcf8a;pointer-events:auto}
#pbox .pbask{pointer-events:auto}
#pbox .m3{display:inline-block;width:32px;height:32px;vertical-align:middle;margin:-8px 0 -6px}
#pbox .m3 canvas{width:32px;height:32px;image-rendering:pixelated;display:block}
#pbox .m3.big,#pbox .m3.big canvas{width:46px;height:46px}
#pbox img.ri{height:22px;vertical-align:middle}
#pbox .pbav{width:52px;height:58px;flex:none;image-rendering:pixelated;border:2px solid #0d0906;box-shadow:0 0 0 2px #5a4632,inset 0 0 8px rgba(0,0,0,.5)}
#pbox .pbtx{flex:1;min-width:0}
#pbox .pbbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:7px}
#pbox .pbbtn button{padding:4px 14px;font:700 13px 'Pixelify Sans',monospace;color:#efe2c6;background:linear-gradient(#3e3630,#221c18);border:2px solid #0d0906;border-radius:0;box-shadow:inset 0 1px 0 #6a5e52,0 2px 0 rgba(0,0,0,.5);cursor:pointer}
#pbox .pbbtn button.ok{background:linear-gradient(#7a4e22,#4e2e12);box-shadow:inset 0 1px 0 #b0804a,0 2px 0 rgba(0,0,0,.5)}
#pbox .pbbtn button:hover{filter:brightness(1.2)}
#pbox .pbprev{display:flex;gap:10px;justify-content:center;margin-top:4px}
#pbox .pbprev span.pc{display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.1}
#pbox .pbprev em{font:900 14px Verdana,Arial,sans-serif;font-style:normal;display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 2px}
#pbox .pbprev em small{font-size:8px;letter-spacing:-1px}
#pbox .pbprev em.hot{color:#ff8a6a}
#setup-tip,#res-prev,#bubble{display:none !important}
body.pbon #hb-status{visibility:hidden}
#reg .rtop,#reg .rhint,#reg .rext,#reg .rext .rres,#reg .rext.sum .rbio,#reg .rext.sum .rcell em{color:#f2e2c0 !important;text-shadow:0 1px 0 #000,0 0 5px rgba(0,0,0,.7) !important}
#reg .rext.sum .rcell em.hot{color:#ffa080 !important}

/* ---- every button: brass rim with hex-like ends, coloured cloth, engraved text ---- */
:root button:not(.rcol):not(.av):not(.mapbtn):not(.rpor):not(.inkc):not(.ink):not(.flip):not(.vclose){position:relative;isolation:isolate;border:0 !important;border-radius:0 !important;background:var(--brassimg) 0 0/32px !important;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);color:#f0d690 !important;font-family:'Pixelify Sans',monospace;font-weight:700;letter-spacing:.3px;text-shadow:0 1px 0 #120a04,0 -1px 0 rgba(255,230,160,.12) !important;box-shadow:none !important;outline:none !important;padding-left:18px;padding-right:18px;image-rendering:pixelated;transition:filter .15s,transform .12s}
:root button:not(.rcol):not(.av):not(.mapbtn):not(.rpor):not(.inkc):not(.ink):not(.flip):not(.vclose)::before{content:'';position:absolute;inset:3px;z-index:-1;background:var(--cloth,var(--cloth-n)) 0 0/48px;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%);box-shadow:inset 0 2px 3px rgba(0,0,0,.55)}
:root button:not(.rcol):not(.av):not(.mapbtn):not(.rpor):not(.inkc):not(.ink):not(.flip):not(.vclose)::after{content:'';position:absolute;left:12px;right:12px;top:5px;bottom:5px;z-index:-1;border-top:1px dashed rgba(232,200,120,.35);border-bottom:1px dashed rgba(232,200,120,.35);pointer-events:none}
/* confirm = green, reject / cancel = red, everything else = brown leather */
:root button.primary,:root button.ok,:root button[data-ok],:root button.rgo,:root button.rok,:root button.rroll{--cloth:var(--cloth-g)}
:root button.no,:root button.cancel,:root button[data-x],:root button[data-no]{--cloth:var(--cloth-r)}
:root #b-endturn{--cloth:var(--cloth-r)}
:root button.on{--cloth:var(--cloth-y)}
:root #hud-right button.panel,:root .fwin button{--cloth:var(--cloth-d)}
:root button:not(.rcol):not(.av):not(.mapbtn):not(.rpor):not(.inkc):not(.ink):not(.flip):not(.vclose):hover:not(:disabled){filter:brightness(1.18);background:var(--brassimg) 0 0/32px !important}
:root button:not(.rcol):not(.av):not(.mapbtn):not(.rpor):not(.inkc):not(.ink):not(.flip):not(.vclose):active:not(:disabled){transform:translateY(1px)}
:root button:disabled{filter:grayscale(.75) brightness(.62);opacity:1 !important}
:root #hud-right button.panel{clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,6px 100%,0 50%);padding-left:14px;padding-right:14px}
#pl-menu{background:var(--pbtex,#1a1612) 0 0/288px 96px !important;border:2px solid #0d0906 !important;box-shadow:0 6px 14px rgba(0,0,0,.5) !important;color:#efe2c6 !important}
#pl-menu small{color:#c8b898 !important}

/* ---- action messages (top corner) and the notice board rows ---- */
#actbox{position:fixed;left:6px;top:4px;z-index:31;display:flex;align-items:center;gap:8px;padding:8px 16px 13px 10px;isolation:isolate;color:#efe2c6;font-family:'Pixelify Sans',monospace;zoom:var(--ui,1);pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .25s,transform .3s}
#actbox::before,.nrow2::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--pbtex) 0 0/288px 96px;image-rendering:pixelated;opacity:.62;-webkit-mask-image:linear-gradient(#000 0,#000 45%,rgba(0,0,0,.5) 78%,transparent 100%);mask-image:linear-gradient(#000 0,#000 45%,rgba(0,0,0,.5) 78%,transparent 100%)}
#actbox::after{content:'';position:absolute;left:0;top:0;bottom:30%;width:3px;background:var(--pc);opacity:.85}
#actbox.left{left:auto;right:6px}
#actbox.in{opacity:1;transform:none}#actbox.out{opacity:0;transform:translateY(-6px)}
.aw{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px}
.aw img{width:42px;height:47px;image-rendering:pixelated;border:2px solid #0d0906;box-shadow:0 0 0 2px var(--pc)}
.aw b{font:700 11px 'Pixelify Sans',monospace;color:#f2e2c0;text-shadow:0 1px 0 #000;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aact{display:flex;flex-direction:column;align-items:center;gap:1px}
.aact canvas{width:58px;height:58px;image-rendering:pixelated}
.aact small{font:600 11px 'Pixelify Sans',monospace;color:#d8c8a4;text-shadow:0 1px 0 #000;white-space:nowrap}
.aarrow .m3{width:26px;height:26px}.aarrow img{width:24px;height:24px;image-rendering:pixelated;vertical-align:middle}
.aitems{display:flex;gap:4px;align-items:center}
.ai{position:relative;display:inline-flex;align-items:center}
.ai .m3{width:36px;height:36px;margin:0}.ai img.ri{width:26px;height:26px}
.ai em{font:900 13px Verdana,sans-serif;font-style:normal;color:#ffe2a8;text-shadow:0 1px 0 #000;margin-left:1px}
.late{opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s}.late.show{opacity:1;transform:none}
#news .nlist{display:flex;flex-direction:column;gap:5px}
.nrow2{position:relative;isolation:isolate;display:flex;align-items:center;gap:7px;padding:5px 10px 8px 7px;color:#efe2c6}
.nrow2::after{content:'';position:absolute;left:0;top:0;bottom:25%;width:3px;background:var(--pc)}
.nrow2 .aw img{width:30px;height:34px}.nrow2 .aw{min-width:40px}.nrow2 .aw b{font-size:10px}
.nrow2 .aact img{width:36px;height:36px;image-rendering:pixelated}
.nrow2 .aact small{font-size:10px}
.nrow2 .npz{width:36px;height:36px;image-rendering:pixelated}
.ai .m3.pz{width:44px;height:44px}
#offer .obox2{position:relative;width:620px;height:420px;zoom:var(--ui,1)}
#offer .obox2 canvas{width:620px;height:420px;image-rendering:pixelated;display:block}
#offer .ohint{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font:600 13px 'Pixelify Sans',monospace;color:#efe2c6;text-shadow:0 1px 0 #000}
#offer .ohint span{color:#ffa080}
#cards .card{width:var(--cw,72px);height:var(--ch,100px)}
/* ================= MAIN MENU ================= */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const NG = { on: false };   // online match state (filled in net/net-game.js); declared first so every hook can read it
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
// double click skips animations: pending waits end now, new ones are near-instant for a moment, scenes run faster.
// Nothing is decided for the player — only the waiting is cut.
const SKIP = { until: 0, timers: new Set() };
const skipping = () => performance.now() < SKIP.until;
const wait = ms => new Promise(r => { if (skipping()) ms = Math.min(ms, 40); const t = { r }; t.id = setTimeout(() => { SKIP.timers.delete(t); r(); }, ms); SKIP.timers.add(t); });
function skipAnims(){
  SKIP.until = performance.now() + 1200;
  SKIP.timers.forEach(t => { clearTimeout(t.id); t.r(); }); SKIP.timers.clear();
  if (typeof tween !== 'undefined' && tween) tween.start -= 1e6;
  if (typeof SCR !== 'undefined' && SCR.hurry) SCR.hurry();
}
addEventListener('dblclick', e => { if (e.target.closest && e.target.closest('input,textarea,.edtag,#chat')) return; skipAnims(); });
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const pick = (arr, rng=Math.random) => arr[Math.floor(rng()*arr.length)];
const angDiff = (a,b) => Math.abs(Math.atan2(Math.sin(a-b), Math.cos(a-b)));

// ================= RENDERER =================
const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  $('#err').style.display='flex'; $('#err').textContent='Tu navegador no pudo iniciar WebGL, que este prototipo necesita para dibujar en 3D.';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 900);
camera.position.set(0, 10, 7.5);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 4; controls.maxDistance = 20; controls.maxPolarAngle = 1.15;
controls.screenSpacePanning = false; controls.target.set(0,0,0);

addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ================= SHARED ASSETS =================

// ================= BOARD INPUT =================
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function setRay(e){ const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1); ray.setFromCamera(ndc, camera); }
function upTo(o, key){ while (o){ if (o.userData && o.userData[key] !== undefined) return o.userData[key]; o = o.parent; } return undefined; }
// pick the closest thing on screen (so tiny targets still work with the camera far away)
function nearPick(list, posOf, e, px = 26){
  const r = canvas.getBoundingClientRect(); let best = null, bd = px*Math.max(1, UI_S);
  for (const it of list){ const p = posOf(it); if (!p) continue; const v = p.clone().project(camera); if (v.z > 1 || v.z < -1) continue;
    const sx = r.left + (v.x + 1)/2*r.width, sy = r.top + (1 - v.y)/2*r.height, d = Math.hypot(sx - e.clientX, sy - e.clientY); if (d < bd){ bd = d; best = it; } }
  return best;
}
const wpos = o => o.getWorldPosition(new THREE.Vector3());
function boardClick(e){
  if (!G || G.over) return;
  if (G.phase === 'setupV' || G.phase === 'setupE'){ setupClick(e); return; }
  if (G.setup) return;
  setRay(e);
  if (G.current === 0 && G.phase === 'robber'){
    const hit = ray.intersectObjects(tileGroups, true)[0];
    if (!hit) return;
    const ti = upTo(hit.object, 'tile');
    if (ti === undefined) return;
    if (ti === G.robber){ notify('El ladrón ya está ahí: elige otro terreno.', G.players[0].color, 'sys'); return; }
    moveRobber(ti, 0); G.phase = G.robberReturn === 'roll' ? 'roll' : 'main'; G.robberReturn = null; refresh(); return;
  }
  if (G.buildMode && markers){
    const hitObj = ray.intersectObjects(markers.children, false)[0]?.object || nearPick(markers.children, wpos, e, 30);
    if (hitObj){
      const { markE, markV } = hitObj.userData, kind = G.buildMode;
      const tokRoad = G.tokenRoad; G.tokenRoad = false; exitBuild();
      if (kind === 'camino'){ const free = G.freeRoads > 0; if (buildRoad(0, markE, free) === false){ refresh(); return; } if (free && tokRoad){ G.players[0].roadTokens = Math.max(0, (G.players[0].roadTokens || 0) - 1); updateInventory(); } notify(free ? 'Construiste un camino gratis' : 'Construiste un camino', G.players[0].color); if (free){ G.freeRoads--; if (G.freeRoads > 0 && validRoads(0).length && G.players[0].roads < 15){ enterBuild('camino'); refresh(); return; } G.freeRoads = 0; } }
      else if (kind === 'pueblo'){ if (buildSettlement(0, markV) === false){ refresh(); return; } notify(`Fundaste el pueblo <b>${G.verts[markV].name}</b>`, G.players[0].color); checkWin(0); }
      else { if (buildCity(0, markV) === false){ refresh(); return; } notify(`<b>${G.verts[markV].name}</b> ahora es ciudad`, G.players[0].color); checkWin(0); }
      refresh(); return;
    }
  }
  if (G.amuletPick && amuletBoardClick(e)) return;
  // mission marks, magnifiers, ports and buildings compete: what the ray hits wins, otherwise the closest on screen
  // (zoomed out, a port next to a coastal village used to take every click meant for the village)
  const r = canvas.getBoundingClientRect(), PX = 24*Math.max(1, UI_S), cands = [];
  const scr = p => { const v = p.clone().project(camera); if (v.z > 1 || v.z < -1) return Infinity; return Math.hypot(r.left + (v.x + 1)/2*r.width - e.clientX, r.top + (1 - v.y)/2*r.height - e.clientY); };
  const consider = (list, posOf, kind, prio, key) => { const hits = ray.intersectObjects(list, true);
    list.forEach(o => { const hit = hits.find(h => { let x = h.object; while (x){ if (x === o) return true; x = x.parent; } return false; }); const d = hit ? -1/(1 + hit.distance) : scr(posOf(o)); if (d < PX) cands.push({ o, kind, d, prio, key }); }); };
  consider(QMARKS, wpos, 'quest', 0, o => upTo(o, 'qvid'));
  consider(LUPAS, wpos, 'lupa', 1, o => upTo(o, 'lupa'));
  consider(G.verts.filter(v => v.mesh).map(v => v.mesh), wpos, 'village', 2, o => upTo(o, 'vid'));
  if (!G.buildMode && G.phase !== 'robber') consider(PORT_GROUPS, g => g.position.clone().setY(.1), 'port', 3, o => upTo(o, 'port'));
  const best = cands.sort((a, b) => (a.d < 0 || b.d < 0 ? a.d - b.d : Math.abs(a.d - b.d) < 6 ? a.prio - b.prio : a.d - b.d))[0];
  if (best){ const k = best.key(best.o);
    if (k !== undefined){
      if (best.kind === 'quest' || best.kind === 'lupa'){ hidePopup(); SFX.click?.(); enterVillage(k); return; }
      if (best.kind === 'village'){ showPopup(k, e.clientX, e.clientY); return; }
      if (best.kind === 'port'){ pierScene(k); return; } } }
  hidePopup();
}

function roofGeo(w, d, rh, color, rng, wallColor){
  rng = rng || Math.random;
  if (color === undefined) color = 0xa0522d;
  const W = w/2 + .35, L = Math.hypot(W, rh) + .08, a = Math.atan2(rh, W), D = d + .5, rows = Math.max(4, Math.round(L/.45));
  const parts = [];
  [-1, 1].forEach(side => {
    const b = new THREE.BoxGeometry(L, .14, D, rows, 1, 1).toNonIndexed();
    colorize(b, (x,y,z,r) => { const row = Math.floor((x + L/2)/(L/rows)); const c = jc(color, r, .07); if (row % 2) c.offsetHSL(0, 0, -.05); if (y < 0) c.offsetHSL(0, 0, -.12); return c; }, rng);
    const m = new THREE.Matrix4().makeRotationZ(side < 0 ? a : -a);
    m.setPosition(side*W/2 - side*Math.sin(a)*.07, rh/2 + Math.cos(a)*.07, 0);
    b.applyMatrix4(m); parts.push(b);
  });
  const ridge = new THREE.BoxGeometry(.32, .2, D + .06).toNonIndexed().translate(0, rh + .1, 0);
  colorize(ridge, (x,y,z,r) => jc(color, r, .05).offsetHSL(0, 0, -.12), rng); parts.push(ridge);
  [-1, 1].forEach(side => {
    const sh = new THREE.Shape(); sh.moveTo(-w/2, 0); sh.lineTo(w/2, 0); sh.lineTo(0, rh*(w/2)/W); sh.closePath();
    const gg = new THREE.ShapeGeometry(sh).toNonIndexed();
    if (side < 0) gg.rotateY(Math.PI);
    gg.translate(0, 0, side*(d/2 + .005));
    colorize(gg, (x,y,z,r) => jc(wallColor ?? color, r, .05).offsetHSL(0, 0, wallColor ? -.04 : -.18), rng); parts.push(gg);
  });
  parts.forEach(p => { if (p.attributes.uv) p.deleteAttribute('uv'); });
  const g = mergeGeometries(parts); parts.forEach(p => p.dispose());
  return g;
}

    pos.push(p.x + nx*width/2, 0, p.z + nz*width/2, p.x - nx*width/2, 0, p.z - nz*width/2);
    if (i < pts.length-1){ const k = i*2; idx.push(k, k+2, k+1, k+1, k+2, k+3); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const ng = g.toNonIndexed(); g.dispose();
  return colorize(ng, (x,y,z,r) => jc(0xb38b5d, r, .1), mulberry32(Math.round(pts[0].x*7 + pts[0].z*13)));
}

const TREE_TPL = {};
function treeTpl(kind, v){
  const key = kind + v;
  if (!TREE_TPL[key]){
    const t = makeTreeTemplate(kind, v + 1);
    TREE_TPL[key] = { trunk: sg(mergeGeometries(t.trunk)), fol: sg(mergeGeometries(t.fol)), h: t.h };
    t.trunk.concat(t.fol).forEach(g => g.dispose());
  }
  return TREE_TPL[key];
}

const FOL_MATS = {};
function folMat(amp){ if (!FOL_MATS[amp]){ const m = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .9 }); texturize(m, 'leaf', undefined, amp); CACHED_MATS.add(m); FOL_MATS[amp] = m; } return FOL_MATS[amp]; }

  constructor(amp = .012){ this.amp = amp; this.items = {}; }
  add(kind, x, y, z, s, ry, tint = 0xffffff){ const v = Math.floor(Math.random()*3); (this.items[kind + '|' + v] ||= []).push([x, y, z, s, ry, tint]); }
  build(sc){
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s3 = new THREE.Vector3(), c = new THREE.Color();
    for (const [key, arr] of Object.entries(this.items)){

let CUR_TREES = null;
function treeKindFor(biome, rng){
  switch (biome){
    case 'bosque': return weighted([['abeto', 35], ['pino', 25], ['roble', 20], ['abedul', 20]]);
    case 'montana': return weighted([['abeto', 65], ['pino', 35]]);
    case 'pradera': return weighted([['roble', 60], ['alamo', 22], ['abedul', 18]]);
    case 'campo': return weighted([['alamo', 50], ['roble', 50]]);
    case 'cerro': return weighted([['roble', 45], ['pino', 35], ['alamo', 20]]);
    default: return weighted([['roble', 60], ['abedul', 20], ['alamo', 20]]);
  }
}
function treeTint(kind, rng){
  if ((kind === 'roble' || kind === 'abedul') && rng() < .09) return pick([0xffb070, 0xffd070, 0xff9a60], rng);
  const l = .88 + rng()*.24; return new THREE.Color(l, l, l*.96).getHex();
}
function bigTree(sc, x, z, kind, s, rng){
  if (!CUR_TREES){ if (kind === 'abeto' || kind === 'pino') pineMesh(sc, x, z, s*1.3, rng); else leafTreeMesh(sc, x, z, s*1.3, rng); return; }
  CUR_TREES.add(kind, x, GH(x, z) - .1, z, s, rng()*6.28, treeTint(kind, rng));

function legs4(g, color, w, top, xs, zs, hoof){
  const legs = [];
  [[-xs,-zs],[xs,-zs],[-xs,zs],[xs,zs]].forEach(([lx,lz]) => {
    const p = new THREE.Group(); p.position.set(lx, top, lz);
    const up = top*.5;
    p.add(mesh(PGEO.limb, color, 0, .02, 0, w*1.15, up + .02, w*1.15));
    const k = new THREE.Group(); k.position.y = -up; p.add(k);
    k.add(mesh(PGEO.joint, color, 0, 0, 0, w, w, w));
    k.add(mesh(PGEO.limb, color, 0, 0, 0, w*.85, top - up, w*.85));
    if (hoof) k.add(mesh(GEO.box, hoof, 0, -(top - up), .01, w*1.9, Math.min(.14, top*.15), w*2.1));
    p.knee = k; g.add(p); legs.push(p);
  });
  return legs;
}

const FW = [];
function celebrate(sc, x, y, z, S, color, n = 3){
  const cols = [color, 0xffd36a, 0xffffff, pick([0xff5a5a, 0x6ad1ff, 0x9dff6a, 0xff8ad8])];
  for (let i=0;i<n;i++) launchFirework(sc, x + (Math.random() - .5)*.25*S, y, z + (Math.random() - .5)*.25*S, S, cols, i*.32 + Math.random()*.1);
}
function launchFirework(sc, x, y, z, S, cols, delay = 0){
  const N = 150, g = new THREE.BufferGeometry(), pos = new Float32Array(N*3), col = new Float32Array(N*4);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 4));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ map: fxTex().dot, size: (S > 3 ? .034 : .1)*S, vertexColors: true, transparent: true, depthWrite: false, fog: false }));
  p.frustumCulled = false; p.visible = false; sc.add(p);

  const H = (S > 3 ? 1.3 + Math.random()*.7 : .95 + Math.random()*.45)*S;
  FW.push({ sc, p, flash, x, y, z, S, H, t: -delay, burst: false, vel: new Float32Array(N*3), life: new Float32Array(N), base: new Float32Array(N*3), cols: cols.map(c => new THREE.Color(c)), trail: 0, ring: Math.random() < .3 });
}
function stepFireworks(dt){
  for (let i = FW.length - 1; i >= 0; i--){
    const f = FW[i]; f.t += dt; if (f.t < 0) continue;
    if (!f.sc.parent && f.sc !== boardScene && f.sc !== villageCtx?.sc){ disposeFw(f, i); continue; }
    const P = f.p.geometry.attributes.position, C = f.p.geometry.attributes.color, N = P.count, S = f.S;
    if (!f.p.visible){ f.p.visible = true; SFX.launch?.(f.S > 3); }
    const RT = .65;
    { const ft = f.t - RT; f.flash.material.opacity = ft > 0 ? .75*Math.max(0, 1 - ft/.3) : 0; f.flash.scale.setScalar(ft > 0 ? (.25 + ft*1.6)*S : .01); }
    if (f.t < RT){ // rocket climbing with a sparkly trail (particles 130..149)
      const k = f.t/RT, hy = f.y + f.H*(1 - (1 - k)*(1 - k));
      P.setXYZ(0, f.x, hy, f.z); C.setXYZW(0, 1, .85, .5, 1); f.life[0] = 1;
      if ((f.trail += dt) > .02){ f.trail = 0; const j = 130 + Math.floor(Math.random()*20); P.setXYZ(j, f.x + (Math.random() - .5)*.03*S, hy, f.z + (Math.random() - .5)*.03*S); f.vel.set([(Math.random() - .5)*.1*S, -.25*S, (Math.random() - .5)*.1*S], j*3); f.life[j] = .45; f.base.set([1, .6, .25], j*3); }
    } else if (!f.burst){ // burst
      f.burst = true; f.life[0] = 0; C.setXYZW(0, 0, 0, 0, 0);
      const cx = P.getX(0), cy = P.getY(0), cz = P.getZ(0); f.flash.position.set(cx, cy, cz);
      const sp = (S > 3 ? 1.15 : 1.5)*(1 + Math.random()*.4)*S;
      for (let j=1;j<130;j++){
        let vx, vy, vz;
        if (f.ring){ const a = j/129*Math.PI*2; vx = Math.cos(a); vy = Math.sin(a)*.35 + .15; vz = Math.sin(a); }
        else { const u = Math.random()*2 - 1, a = Math.random()*6.28, r = Math.sqrt(1 - u*u); vx = r*Math.cos(a); vy = u; vz = r*Math.sin(a); }
        const m = sp*(.75 + Math.random()*.3);
        f.vel.set([vx*m, vy*m, vz*m], j*3); P.setXYZ(j, cx, cy, cz); f.life[j] = 1.2 + Math.random()*.7;
        const c = f.cols[j % 3 === 0 ? 0 : Math.floor(Math.random()*f.cols.length)]; f.base.set([c.r, c.g, c.b], j*3);
      }
      SFX.boom?.(f.S > 3);
    }
    let alive = f.t < RT;
    for (let j=1;j<N;j++){
      if (f.life[j] <= 0){ C.setW(j, 0); continue; }
      alive = true; f.life[j] -= dt;
      const v = f.vel, o = j*3, drag = Math.pow(.18, dt);
      v[o] *= drag; v[o + 1] = v[o + 1]*drag - .55*S*dt; v[o + 2] *= drag;
      P.setXYZ(j, P.getX(j) + v[o]*dt, P.getY(j) + v[o + 1]*dt, P.getZ(j) + v[o + 2]*dt);
      const l = Math.max(0, Math.min(1, f.life[j]/1.1)), tw = j < 130 && f.life[j] < .6 ? (Math.random() < .5 ? .3 : 1) : 1;
      C.setXYZW(j, f.base[o], f.base[o + 1], f.base[o + 2], l*tw);
    }
    P.needsUpdate = true; C.needsUpdate = true;
    if (!alive && f.t > RT + .2) disposeFw(f, i);
  }
}

const OUT_T = { value: 0 }, OUT_MATS = new Map();
function contourMats(color){
  const key = String(color); if (OUT_MATS.has(key)) return OUT_MATS.get(key);
  const mk = (col, w, glow) => keepMat(new THREE.ShaderMaterial({
    uniforms: { col: { value: new THREE.Color(col) }, w: { value: w }, t: OUT_T }, side: THREE.BackSide,
    vertexShader: 'uniform float w; void main(){ vec3 n = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position, 1.); mv.xyz += n*(-mv.z)*w; gl_Position = projectionMatrix*mv; }',
    fragmentShader: glow ? 'uniform vec3 col; uniform float t; void main(){ gl_FragColor = vec4(min(col*(1.05 + .25*sin(t*3.)) + .08, vec3(1.)), 1.); }' : 'uniform vec3 col; void main(){ gl_FragColor = vec4(col, 1.); }',
  }));

function silhouette(group){
  group.updateMatrixWorld(true);
  const inv = group.matrixWorld.clone().invert(), parts = [];
  group.traverse(o => {
    if (!o.isMesh || o.userData.outline || o.userData.glow) return;
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    Object.keys(g.attributes).forEach(k => { if (k !== 'position' && k !== 'normal') g.deleteAttribute(k); });
    if (!g.attributes.normal) g.computeVertexNormals();
    g.clearGroups(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld)); parts.push(g);
  });

}

function updateVillage(dt, t){
  const c = villageCtx, k = ctl.keys;

  }

  // so you slide past and can always walk away (even if it was the one that walked into you)
  if (f || s){
    const block = (x, z, r) => { const min = r + .4, dx = ctl.pos.x - x, dz = ctl.pos.z - z; if (Math.abs(dx) > min || Math.abs(dz) > min) return;

}

function startAllowance(p){
  const v = G.verts[G.players[p].v2]; if (!v) return { n: 0, types: [] };

}
// a bot takes what its land produces least of, among what it is allowed and what a village and a road cost
function botStartPick(p){

  G.verts.filter(v => v.building && v.building.p === p).forEach(v => v.tiles.forEach(ti => { const t = G.tiles[ti], r = TERRAIN[t.type].res; if (r && t.num) prod[r] += 6 - Math.abs(7 - t.num); }));
  const order = types.slice().sort((a, b) => (prod[a] - want[a]) - (prod[b] - want[b]) + (Math.random() - .5)*.5), got = {};

async function menuClick(e){
  const el = MENU.el, mm = e.target.closest('.mmode');
  if (mm){ MENU.sel = mm.dataset.mode; el.querySelectorAll('.mmode').forEach(x => x.classList.toggle('sel', x === mm)); SFX.click?.(); return; }

  if (e.target.closest('.mtoggle[data-fp]')){ MENU.fp = !MENU.fp; updFpToggle(); SFX.click?.(); return; }
  const np = e.target.closest('.mnpb'); if (np){ MENU.np = +np.dataset.np; updNp(); SFX.click?.(); return; }
  if (e.target.closest('.mext')){ MENU.ext56 = !MENU.ext56; if (MENU.ext56 && !MENU.online) MENU.np = 6; updNp(); SFX.click?.(); return; }
  if (e.target.closest('.mbots')){ MENU.bots = !MENU.bots; updNp(); SFX.click?.(); return; }
  const b3 = e.target.closest('.m3b'); if (b3){ SFX.click?.(); if (b3.dataset.act === 'copy') copyKey(); else if (b3.dataset.act === 'next'){ MENU.online = true; menuGo('play'); } return; }
  const a = e.target.closest('[data-go]'); if (!a) return; SFX.click?.(); audioInit();
  const go = a.dataset.go;
  if (go === 'play'){ MENU.online = false; menuGo('play'); }

  else if (go === 'start'){
    GAME_OPTS.mode = MENU.sel; GAME_OPTS.firstPerson = MENU.fp;
    if (MENU.online){ NET.me.name = myName(); const r = await netJoin(MENU.key, { host: true, match: MENU.match, name: NET.me.name }); if (r.error){ el.querySelector('[data-v=mp] .mnote').textContent = 'No se pudo abrir la sala: ' + netErrText(r.error); menuGo('mp'); return; } netHostStart(MENU.np, MENU.bots); return; }
    closeMainMenu(); applyGameOpts(); newGame(MENU.ext56 ? MENU.np : undefined); startRegistration();
  }
  else if (go === 'create'){ MENU.key = menuNewKey(); MENU.match = ''; el.querySelector('.mname').value = ''; menuGo('create'); }
  else if (go === 'dojoin'){ const k = cleanKey(el.querySelector('.mkey').value), note = el.querySelector('.jnote');
    if (k.length !== 7){ note.textContent = 'La clave tiene 6 letras o números, como K7M-2QX.'; return; }
    note.textContent = 'Buscando la sala…'; NET.me.name = myName(); const r = await netJoin(k, { name: NET.me.name });
    if (r.error){ note.textContent = r.error === 'not_permitted' ? 'Este enlace no te deja entrar a salas: pide al anfitrión que te comparta el artifact con permiso para participar.' : netErrText(r.error); return; }
    MENU.key = k; note.textContent = 'Esperando al anfitrión…';
    clearTimeout(NG.joinT); NG.joinT = setTimeout(async () => { if (NG.on) return; note.textContent = 'No hay ninguna partida abierta con esa clave (o ya no acepta jugadores).'; await netLeave(); }, 15000); }
  else if (go === 'exit') menuGo('exit');
  else if (go === 'bye'){ menuGo('bye'); try { window.close(); } catch {} }
  else menuGo(go);
}

const KSIZE = { corner: 1, hex: 1, hud: 1 };
// limits so the screen never gets crowded nor too tiny: [min, max, largest share of the window width, of its height]

// ---------- one way to edit every board panel: brass frame on hover, a name plate to move it, four corners to resize ----------
// (the floating inventories build the same pieces themselves: ui/inventory.js). Double click on the plate = back to normal.
function edCorners(el, onDown, onMove, onEnd){
  ['tl', 'tr', 'bl', 'br'].forEach(c => { const h = document.createElement('i'); h.className = 'edc ' + c; h.dataset.c = c; h.title = 'Arrastra para cambiar el tamaño'; el.appendChild(h);
    let op = null;
    h.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); op = { x: e.clientX, y: e.clientY }; onDown(); el.classList.add('edit'); try { h.setPointerCapture(e.pointerId); } catch {} });
    h.addEventListener('pointermove', e => { if (!op) return; const dx = e.clientX - op.x, dy = e.clientY - op.y; onMove((c[1] === 'r' ? dx : -dx) + (c[0] === 'b' ? dy : -dy)); });
    const end = () => { if (!op) return; op = null; el.classList.remove('edit'); onEnd(); }; h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
    h.addEventListener('click', e => e.stopPropagation(), true); });
}
function edTag(el, name, onReset){ const t = document.createElement('b'); t.className = 'edtag'; t.textContent = name; t.title = 'Arrastra para mover · doble clic: tamaño y lugar normales'; el.appendChild(t);
  t.addEventListener('dblclick', e => { e.stopPropagation(); onReset(); SFX.click?.(); }); return t; }
function addGrip(el, key, name, move){
  if (!el || el.querySelector(':scope > .edc')) return; el.classList.add('edfr');
  // hover by position: these panels let clicks through (pointer-events:none) and other layers may sit on top of them
  addEventListener('pointermove', e => { if (e.buttons) return; const r = el.getBoundingClientRect(), m = 14, on = r.width > 0 && e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - 30 && e.clientY < r.bottom + m; el.classList.toggle('hov', on); }, { passive: true });
  let k0 = 1;
  edCorners(el, () => { k0 = KSIZE[key]; }, d => { const L = KLIM[key], prev = KSIZE[key]; KSIZE[key] = clamp(k0*(1 + d/260), L[0], L[1]); applyK();
      const r = el.getBoundingClientRect(); if (KSIZE[key] > prev && (r.width > innerWidth*L[2] || r.height > innerHeight*L[3])){ KSIZE[key] = prev; applyK(); } },
    () => { try { localStorage.setItem('hexterra-ksize', JSON.stringify(KSIZE)); } catch {} if (typeof dockWins === 'function') dockWins(); });
  const t = edTag(el, name, () => { KSIZE[key] = 1; applyK(); if (move && move.reset) move.reset(); try { localStorage.setItem('hexterra-ksize', JSON.stringify(KSIZE)); } catch {} if (typeof dockWins === 'function') dockWins(); });
  if (move && move.drag){ let op = null;
    t.addEventListener('pointerdown', e => { if (e.button) return; e.preventDefault(); e.stopPropagation(); op = { x: e.clientX, y: e.clientY }; move.start(); el.classList.add('edit', 'drag'); try { t.setPointerCapture(e.pointerId); } catch {} });
    t.addEventListener('pointermove', e => { if (op) move.drag(e.clientX - op.x, e.clientY - op.y); });
    const end = () => { if (!op) return; op = null; el.classList.remove('edit', 'drag'); move.end(); }; t.addEventListener('pointerup', end); t.addEventListener('pointercancel', end); }
}

// the whole group of signs can be dragged; it sticks to the closest side (board / missions icons always face the center)
function cornerDrag(c){
  let op = null, block = false;
  c.addEventListener('pointerdown', e => { if (e.button || e.target.closest('.edc')) return; const r = c.getBoundingClientRect(); op = { x0: e.clientX, y0: e.clientY, l: r.left, moved: 0, id: e.pointerId }; }, true);

  addEventListener('pointerup', () => { if (!op) return; const moved = op.moved > 8; op = null; if (!moved) return;
    block = true; setTimeout(() => block = false, 60); c.classList.remove('drag'); const r = c.getBoundingClientRect(); c.style.transformOrigin = '';
    CORNER_SIDE = r.left + r.width/2 < innerWidth/2 ? 'l' : 'r'; try { localStorage.setItem('hexterra-corner', CORNER_SIDE); } catch {} SFX.click?.(); layoutCorner(); });
  c.addEventListener('click', e => { if (block){ e.stopPropagation(); e.preventDefault(); } }, true);
